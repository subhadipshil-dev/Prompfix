<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompfix - AI Prompt Refiner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="prompfix-popup">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-group">
        <div class="logo-icon">
          <span class="material-symbols-outlined">auto_awesome</span>
        </div>
        <span class="logo-text">Prompfix</span>
      </div>
      <button class="settings-btn" id="manage-keys-button" title="Settings">
        <span class="material-symbols-outlined" style="font-size: 18px;">settings</span>
      </button>
    </header>

    <!-- Main Content -->
    <main class="popup-main">
      <!-- Input Section -->
      <div>
        <label class="pf-label">Your Prompt</label>
        <textarea 
          class="pf-textarea" 
          id="input-prompt" 
          placeholder="Enter your prompt here..."
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Style Selector -->
      <div>
        <label class="pf-label">Refinement Style</label>
        <div class="style-selector" id="style-selector">
          <button class="style-btn active" data-style="Clearer">
            <span>Clearer</span>
          </button>
          <button class="style-btn" data-style="More Detailed">
            <span>More Detailed</span>
          </button>
          <button class="style-btn" data-style="Shorter">
            <span>Shorter</span>
          </button>
          <button class="style-btn" data-style="Professional">
            <span>Professional</span>
          </button>
          <button class="style-btn" data-style="For Coding">
            <span>For Coding</span>
          </button>
        </div>
      </div>

      <!-- Refine Button -->
      <button class="pf-btn-primary" id="refine-button">
        <span class="material-symbols-outlined">magic_button</span>
        <span>Refine Prompt</span>
      </button>

      <!-- Notice -->
      <div class="pf-notice" id="notice"></div>

      <!-- Output Section -->
      <div style="flex: 1; display: flex; flex-direction: column;">
        <label class="pf-label">Refined Prompt</label>
        <div class="output-container">
          <div class="output-content" id="refined-text">
            <span class="output-placeholder">Your refined prompt will appear here...</span>
          </div>
          <button class="copy-btn" id="copy-button" title="Copy to clipboard">
            <span class="material-symbols-outlined" style="font-size: 14px;">content_copy</span>
            <span>Copy</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="status-model">Ready</span>
      </div>
      <div class="copy-feedback" id="copy-feedback">Copied!</div>
    </footer>
  </div>

  <script src="../api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
