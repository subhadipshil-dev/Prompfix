<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompfix</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">

    <!-- Header -->
    <div class="popup-header">
      <div class="brand">
        <div class="brand-icon">P</div>
        <span class="brand-name">Prompfix</span>
        <span class="provider-badge" id="provider-label">OpenAI</span>
      </div>
      <div class="header-actions">
        <div class="icon-btn" id="settings-btn" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="icon-btn" id="history-btn" title="History">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 3"/><path d="M12 7v5l3 3"/></svg>
        </div>
      </div>
    </div>

    <!-- Body -->
    <div class="popup-body">

      <!-- Prompt -->
      <div>
        <div class="sec-label">Your Prompt</div>
        <div class="prompt-wrap">
          <textarea class="prompt-input" id="prompt-input" placeholder="Enter your rough prompt here…" spellcheck="false"></textarea>
          <div class="prompt-footer">
            <span class="char-badge" id="char-count">0 chars</span>
            <div class="grab-btn" id="grab-btn">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
              Grab from page
            </div>
          </div>
        </div>
      </div>

      <!-- Mode -->
      <div>
        <div class="sec-label">Mode</div>
        <div class="pill-row" id="mode-pills">
          <div class="pill active-mode" data-mode="Basic">Basic</div>
          <div class="pill" data-mode="Balanced">Balanced</div>
          <div class="pill" data-mode="Advanced">Advanced</div>
        </div>
      </div>

      <!-- Style -->
      <div>
        <div class="sec-label">Style</div>
        <div class="pill-row" id="style-pills">
          <div class="pill active-style" data-style="Clearer">Clearer</div>
          <div class="pill" data-style="More Detailed">More Detailed</div>
          <div class="pill" data-style="Shorter">Shorter</div>
          <div class="pill" data-style="Professional">Professional</div>
          <div class="pill" data-style="For Coding">For Coding</div>
        </div>
      </div>

      <!-- Refine button -->
      <button class="refine-btn" id="refine-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L13.6 7.2L19 8.8L13.6 10.4L12 15.6L10.4 10.4L5 8.8L10.4 7.2L12 2Z"/><circle cx="17.5" cy="5.5" r="1.8"/></svg>
        Refine Prompt
      </button>

      <!-- Output -->
      <div>
        <div class="sec-label">Refined Prompt</div>
        <div class="output-section">
          <div class="output-placeholder" id="output-placeholder">
            <div class="output-placeholder-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L13.6 7.2L19 8.8L13.6 10.4L12 15.6L10.4 10.4L5 8.8L10.4 7.2L12 2Z"/></svg>
            </div>
            <div class="output-placeholder-text">Your refined prompt<br>will appear here…</div>
          </div>
          <div class="output-content" id="output-content">
            <div class="output-top">
              <div class="output-dot-label">
                <span class="live-dot"></span> Output
              </div>
              <div class="output-copy-btn" id="output-copy-btn">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy
              </div>
            </div>
            <div class="output-text" id="output-text"></div>
            <div class="output-actions">
              <button class="oa oa-use" id="use-this-btn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Use this
              </button>
              <button class="oa oa-insert" id="insert-page-btn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                Insert on page
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-left">
        <div class="status-dot"></div>
        <span class="status-provider" id="status-provider">OpenAI · gpt-4o-mini</span>
      </div>
      <div class="dash-link" id="dash-link">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </div>
    </div>

  </div>

  <script src="../api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
