
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0B0B0E;--surface:#111115;--card:#1C1C23;--border:#26262E;--border2:#343444;
    --accent:#7C3AED;--txt1:#F0F0F4;--txt2:#A0A0B0;--txt3:#5C5C72;
    --green:#10B981;--red:#EF4444;--r:10px;
  }
  body{background:var(--bg);color:var(--txt1);font-family:'DM Sans',sans-serif}
  .wrap{display:flex;height:680px;background:var(--bg);border-radius:14px;overflow:hidden;border:1px solid var(--border)}
  .sb{width:200px;min-width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:9px;padding:20px 16px 18px;border-bottom:1px solid var(--border)}
  .logomark{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .appname{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--txt1);line-height:1.1}
  .appsub{font-size:10px;color:var(--txt3)}
  .steps{padding:16px 10px;flex:1}
  .si{display:flex;align-items:flex-start;gap:9px;padding:7px 8px;border-radius:8px;margin-bottom:1px;transition:background .15s}
  .si.active{background:rgba(124,58,237,.14)}
  .si.future{opacity:.38}
  .si.done{opacity:.6}
  .snum{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--txt3);flex-shrink:0;margin-top:1px;transition:all .2s}
  .si.active .snum{background:var(--accent);border-color:var(--accent);color:#fff}
  .si.done .snum{background:var(--green);border-color:var(--green);color:#fff;font-size:10px}
  .slabel{font-size:12.5px;font-weight:500;color:var(--txt2)}
  .ssub{font-size:10.5px;color:var(--txt3);margin-top:1px}
  .si.active .slabel{color:#D9C8FF}
  .sbfoot{padding:12px 16px;border-top:1px solid var(--border);font-size:10.5px;color:var(--txt3);display:flex;align-items:center;gap:5px}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .scroll{flex:1;overflow-y:auto;padding:40px 52px 24px}
  .scroll::-webkit-scrollbar{width:4px}
  .scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
  .pane{transition:opacity .22s ease,transform .22s ease}
  .pane.hidden{opacity:0;transform:translateX(16px)}
  .pane.hidden.bwd{transform:translateX(-16px)}
  h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;color:var(--txt1);margin-bottom:5px}
  .sub{font-size:12.5px;color:var(--txt3);margin-bottom:28px;display:flex;align-items:center;gap:5px}
  .lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);margin-bottom:7px}
  .fld{margin-bottom:18px}
  input[type=text],input[type=password]{width:100%;padding:10px 13px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);color:var(--txt1);font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.18)}
  input.err{border-color:var(--red)}
  input::placeholder{color:var(--txt3)}
  .errmsg{font-size:11px;color:var(--red);margin-top:4px}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:3px}
  .pc{padding:12px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .15s;position:relative;user-select:none}
  .pc:hover{border-color:var(--border2);background:#20202A}
  .pc.sel{border-color:var(--accent);background:rgba(124,58,237,.1)}
  .picon{font-size:18px;display:block;margin-bottom:7px;line-height:1}
  .pname{font-size:12px;font-weight:600;color:var(--txt1);margin-bottom:1px}
  .pdesc{font-size:10px;color:var(--txt3);line-height:1.3}
  .pchk{position:absolute;top:6px;right:6px;width:14px;height:14px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff}
  .krow{position:relative}
  .ktog{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--border);border:none;border-radius:4px;color:var(--txt3);font-size:11px;font-family:'DM Sans',sans-serif;padding:3px 8px;cursor:pointer;transition:background .15s}
  .ktog:hover{background:var(--border2);color:var(--txt1)}
  .khint{font-size:10.5px;color:var(--txt3);margin-top:5px;display:flex;gap:4px;align-items:center}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mc{padding:12px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:10px;user-select:none}
  .mc:hover{border-color:var(--border2);background:#20202A}
  .mc.sel{border-color:var(--accent);background:rgba(124,58,237,.1)}
  .mradio{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .mc.sel .mradio{border-color:var(--accent);background:var(--accent)}
  .mrdot{width:5px;height:5px;background:#fff;border-radius:50%}
  .mtag{font-size:9px;font-weight:700;padding:1.5px 5px;border-radius:3px;background:var(--border);color:var(--txt3);display:inline-block;margin-bottom:3px}
  .mc.sel .mtag{background:rgba(124,58,237,.22);color:#B09EF5}
  .mname{font-size:12px;font-weight:600;color:var(--txt1);margin-bottom:1.5px}
  .mdesc{font-size:10.5px;color:var(--txt3);line-height:1.35}
  .noprov{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px;color:var(--txt3);font-size:13px;gap:7px;text-align:center;background:var(--card);border:1px dashed var(--border2);border-radius:var(--r)}
  .sc{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .15s;margin-bottom:7px;user-select:none}
  .sc:hover{border-color:var(--border2);background:#20202A}
  .sc.sel{border-color:var(--accent);background:rgba(124,58,237,.1)}
  .sico{width:36px;height:36px;background:var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:background .15s}
  .sc.sel .sico{background:rgba(124,58,237,.22)}
  .sname{font-size:13px;font-weight:500;color:var(--txt1)}
  .sdesc{font-size:11px;color:var(--txt3);margin-top:1.5px}
  .stk{margin-left:auto;width:17px;height:17px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;flex-shrink:0}
  .trow{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);margin-top:12px}
  .tlbl{font-size:13px;font-weight:500;color:var(--txt1)}
  .tdesc{font-size:11px;color:var(--txt3);margin-top:1.5px}
  .tog{width:38px;height:21px;border-radius:11px;background:var(--border2);cursor:pointer;position:relative;transition:background .2s;border:none;flex-shrink:0}
  .tog.on{background:var(--accent)}
  .tthumb{position:absolute;top:3px;left:3px;width:15px;height:15px;background:#fff;border-radius:50%;transition:transform .2s}
  .tog.on .tthumb{transform:translateX(17px)}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:16px 52px;border-top:1px solid var(--border);background:var(--surface)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:8px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;border:none}
  .btng{background:transparent;color:var(--txt2);border:1px solid var(--border)}
  .btng:hover{background:var(--card);color:var(--txt1)}
  .btnp{background:var(--accent);color:#fff}
  .btnp:hover{background:#6D28D9}
  .btnp:active{transform:scale(.98)}
  .success{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding-top:10px}
  .sring{width:68px;height:68px;border-radius:50%;border:2px solid rgba(124,58,237,.35);background:rgba(124,58,237,.12);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:22px}
  .stitle{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:var(--txt1);margin-bottom:8px}
  .ssub2{font-size:13px;color:var(--txt3);line-height:1.7;margin-bottom:24px;max-width:310px}
  .summary{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:16px 20px;width:100%;max-width:360px;text-align:left;margin-bottom:26px}
  .srow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--border)}
  .srow:last-child{border-bottom:none}
  .sk{color:var(--txt3)}
  .sv{color:var(--txt1);font-weight:500;display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .bdg{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(16,185,129,.15);color:#34D399}
  .sep{height:1px;background:var(--border);margin:14px 0}
</style>

<div class="wrap">
  <aside class="sb">
    <div class="logo">
      <div class="logomark">✦</div>
      <div>
        <div class="appname">Prompfix</div>
        <div class="appsub">Prompt Refiner</div>
      </div>
    </div>
    <nav class="steps" id="steps"></nav>
    <div class="sbfoot">🔒 Keys stored locally only</div>
  </aside>

  <div class="main">
    <div class="scroll">
      <div class="pane" id="pane"></div>
    </div>
    <div class="nav">
      <div><button class="btn btng" id="backBtn" style="display:none" onclick="goBack()">← Back</button></div>
      <button class="btn btnp" id="nextBtn" onclick="goNext()">Continue →</button>
    </div>
  </div>
</div>

<script>
const PROVIDERS = [
  { id:"openai",    name:"OpenAI",    icon:"⬡", color:"#10A37F", desc:"GPT-4o, o1, o3 series",      kp:"sk-proj-...",
    models:[
      {id:"gpt-4o",          name:"GPT-4o",          tag:"Flagship",      desc:"Most capable multimodal"},
      {id:"gpt-4o-mini",     name:"GPT-4o mini",      tag:"Fast",          desc:"Affordable & intelligent"},
      {id:"o3-mini",         name:"o3-mini",           tag:"Reasoning",     desc:"Latest fast reasoning"},
      {id:"o1",              name:"o1",               tag:"Reasoning",     desc:"Deep analysis & complex tasks"},
      {id:"o1-mini",         name:"o1-mini",           tag:"Reasoning",     desc:"Compact reasoning model"},
      {id:"gpt-4-turbo",     name:"GPT-4 Turbo",      tag:"Powerful",      desc:"128K context, high performance"},
      {id:"gpt-3.5-turbo",   name:"GPT-3.5 Turbo",    tag:"Legacy",        desc:"Fast & cost-effective classic"},
    ]},
  { id:"anthropic", name:"Anthropic", icon:"◆", color:"#D4734A", desc:"Claude 3.5, 4 & beyond",     kp:"sk-ant-api03-...",
    models:[
      {id:"claude-opus-4-6",   name:"Claude Opus 4.6",   tag:"Most Powerful", desc:"Frontier for complex tasks"},
      {id:"claude-sonnet-4-6", name:"Claude Sonnet 4.6", tag:"Balanced",      desc:"Smart & efficient everyday"},
      {id:"claude-haiku-4-5",  name:"Claude Haiku 4.5",  tag:"Fast",          desc:"Compact & responsive"},
      {id:"claude-3-5-sonnet", name:"Claude 3.5 Sonnet", tag:"Popular",       desc:"Excellent coding & analysis"},
      {id:"claude-3-5-haiku",  name:"Claude 3.5 Haiku",  tag:"Efficient",     desc:"Best speed-smarts balance"},
      {id:"claude-3-opus",     name:"Claude 3 Opus",     tag:"Deep",          desc:"Thoughtful, nuanced responses"},
    ]},
  { id:"google",    name:"Google",    icon:"◉", color:"#4285F4", desc:"Gemini 1.5, 2.0 & 2.5",     kp:"AIzaSy...",
    models:[
      {id:"gemini-2.5-pro",      name:"Gemini 2.5 Pro",     tag:"Latest",    desc:"Frontier model with thinking"},
      {id:"gemini-2.0-flash",    name:"Gemini 2.0 Flash",   tag:"Fast",      desc:"Speed + multimodal capability"},
      {id:"gemini-1.5-pro",      name:"Gemini 1.5 Pro",     tag:"Context",   desc:"Massive 2M token context"},
      {id:"gemini-1.5-flash",    name:"Gemini 1.5 Flash",   tag:"Efficient", desc:"Fast & cost-effective"},
      {id:"gemini-1.5-flash-8b", name:"Gemini 1.5 Flash 8B",tag:"Lite",      desc:"Ultra-lightweight tasks"},
    ]},
  { id:"mistral",   name:"Mistral AI",icon:"◈", color:"#FF7000", desc:"Open & commercial models",   kp:"Enter API key...",
    models:[
      {id:"mistral-large-latest",  name:"Mistral Large",   tag:"Flagship", desc:"Top-tier reasoning & multilingual"},
      {id:"mistral-medium-latest", name:"Mistral Medium",  tag:"Balanced", desc:"Strong at lower cost"},
      {id:"mistral-small-latest",  name:"Mistral Small",   tag:"Fast",     desc:"Low-latency, cost-optimized"},
      {id:"codestral-latest",      name:"Codestral",       tag:"Code",     desc:"Specialized code generation"},
      {id:"mixtral-8x22b",         name:"Mixtral 8x22B",   tag:"MoE",      desc:"Mixture-of-experts powerhouse"},
    ]},
  { id:"groq",      name:"Groq",      icon:"▷", color:"#F55036", desc:"Ultra-fast LPU inference",   kp:"gsk_...",
    models:[
      {id:"llama-3.3-70b",  name:"Llama 3.3 70B", tag:"Fast",       desc:"Meta's flagship at blazing speed"},
      {id:"llama-3.1-8b",   name:"Llama 3.1 8B",  tag:"Ultra-fast", desc:"Near-instant responses"},
      {id:"mixtral-8x7b",   name:"Mixtral 8x7B",  tag:"MoE",        desc:"32K context at high speed"},
      {id:"gemma2-9b",      name:"Gemma 2 9B",    tag:"Open",       desc:"Google's open model on Groq"},
      {id:"qwq-32b",        name:"QwQ 32B",       tag:"Reasoning",  desc:"Advanced reasoning model"},
    ]},
  { id:"cohere",    name:"Cohere",    icon:"❋", color:"#39B58A", desc:"Enterprise RAG & generation",kp:"Enter API key...",
    models:[
      {id:"command-r-plus", name:"Command R+ (Aug '24)", tag:"Advanced",  desc:"Best for complex RAG pipelines"},
      {id:"command-r",      name:"Command R (Aug '24)",  tag:"Efficient", desc:"Balanced RAG & generation"},
      {id:"command-light",  name:"Command Light",        tag:"Fast",      desc:"Lightweight quick tasks"},
    ]},
];

const STYLES = [
  {id:"concise",      name:"Concise & Direct",       icon:"⚡", desc:"Strips fluff, keeps only essential instructions"},
  {id:"balanced",     name:"Balanced",               icon:"⚖",  desc:"Improves clarity while maintaining original tone"},
  {id:"professional", name:"Highly Professional",    icon:"◆", desc:"Formal tone, structured format, extremely detailed"},
  {id:"creative",     name:"Creative & Exploratory", icon:"✦", desc:"Expands ideas, suggests alternatives, opens possibilities"},
];

const STEP_META = [
  {n:1,label:"Profile",       sub:"Your name & details"},
  {n:2,label:"API Connection",sub:"Connect your AI provider"},
  {n:3,label:"Default Model", sub:"Choose your go-to model"},
  {n:4,label:"Preferences",   sub:"Style & history"},
  {n:5,label:"All Set",       sub:"You're ready to go"},
];

let step = 1;
let form = { name:"", social:"", provider:"", key:"", showKey:false, model:"", style:"balanced", history:true };

function setStep(n, dir="fwd") {
  const pane = document.getElementById("pane");
  pane.className = "pane hidden " + dir;
  setTimeout(() => {
    step = n;
    render();
    pane.className = "pane";
  }, 220);
}

function goNext() {
  if (step === 1) {
    if (!form.name.trim()) { showErr("errName","Display name is required"); return; }
  }
  if (step === 2) {
    if (!form.provider) { showErr("errProv","Please select a provider"); return; }
    if (!form.key.trim()) { showErr("errKey","API key is required"); return; }
  }
  if (step === 3) {
    if (!form.model) { showErr("errModel","Please select a model"); return; }
  }
  if (step < 5) setStep(step + 1, "fwd");
}
function goBack() { if (step > 1) setStep(step - 1, "bwd"); }
function showErr(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.style.display = "block"; }
}

function renderSteps() {
  const cont = document.getElementById("steps");
  cont.innerHTML = STEP_META.map(s => {
    const cls = step === s.n ? "active" : step > s.n ? "done" : "future";
    const num = step > s.n ? "✓" : s.n;
    return `<div class="si ${cls}">
      <div class="snum">${num}</div>
      <div><div class="slabel">${s.label}</div><div class="ssub">${s.sub}</div></div>
    </div>`;
  }).join("");
}

function renderPane() {
  const prov = PROVIDERS.find(p => p.id === form.provider);
  const pane = document.getElementById("pane");
  const back = document.getElementById("backBtn");
  const next = document.getElementById("nextBtn");

  back.style.display = (step > 1 && step < 5) ? "" : "none";
  next.style.display = step < 5 ? "" : "none";
  next.textContent = step === 4 ? "Finish →" : "Continue →";

  if (step === 1) {
    pane.innerHTML = `
      <h1>Create your profile</h1>
      <p class="sub">Personalizes your prompt refinement experience.</p>
      <div class="fld">
        <label class="lbl">Display Name</label>
        <input type="text" id="iName" placeholder="Alex Rivera" value="${esc(form.name)}" oninput="form.name=this.value">
        <div class="errmsg" id="errName" style="display:none"></div>
      </div>
      <div class="fld">
        <label class="lbl">Role or Social <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--txt3)">(optional)</span></label>
        <input type="text" id="iSocial" placeholder="https://x.com/yourhandle" value="${esc(form.social)}" oninput="form.social=this.value">
      </div>`;
  }

  else if (step === 2) {
    const pcards = PROVIDERS.map(p => `
      <div class="pc${form.provider===p.id?" sel":""}" onclick="selProv('${p.id}')">
        ${form.provider===p.id?'<div class="pchk">✓</div>':''}
        <span class="picon" style="color:${p.color}">${p.icon}</span>
        <div class="pname">${p.name}</div>
        <div class="pdesc">${p.desc}</div>
      </div>`).join("");
    pane.innerHTML = `
      <h1>Connect your AI</h1>
      <p class="sub">API key stored securely on your device, never shared.</p>
      <div class="fld">
        <label class="lbl">Provider</label>
        <div class="pgrid">${pcards}</div>
        <div class="errmsg" id="errProv" style="display:none"></div>
      </div>
      <div class="fld">
        <label class="lbl">API Key</label>
        <div class="krow">
          <input id="iKey" type="${form.showKey?"text":"password"}" placeholder="${prov?prov.kp:"Select a provider above…"}" value="${esc(form.key)}" oninput="form.key=this.value" style="padding-right:55px">
          <button class="ktog" onclick="toggleKey()">${form.showKey?"Hide":"Show"}</button>
        </div>
        <div class="errmsg" id="errKey" style="display:none"></div>
        <div class="khint">🔒 Never shared · Stored in chrome.storage.local</div>
      </div>`;
  }

  else if (step === 3) {
    if (!prov) {
      pane.innerHTML = `
        <h1>Choose your default model</h1>
        <p class="sub">You can change this later in settings.</p>
        <div class="noprov">
          <span style="font-size:34px;opacity:.35">◉</span>
          <span>No provider selected</span>
          <span style="font-size:11px;opacity:.6">Go back and select an AI provider first</span>
        </div>`;
    } else {
      const mcards = prov.models.map(m => `
        <div class="mc${form.model===m.id?" sel":""}" onclick="selModel('${m.id}')">
          <div class="mradio">${form.model===m.id?'<div class="mrdot"></div>':''}</div>
          <div>
            <div class="mtag">${m.tag}</div>
            <div class="mname">${m.name}</div>
            <div class="mdesc">${m.desc}</div>
          </div>
        </div>`).join("");
      pane.innerHTML = `
        <h1>Choose your default model</h1>
        <p class="sub"><span class="dot" style="background:${prov.color};width:7px;height:7px;border-radius:50%;display:inline-block"></span> ${prov.name} · ${prov.models.length} models available</p>
        <div class="mgrid">${mcards}</div>
        <div class="errmsg" id="errModel" style="display:none;margin-top:10px"></div>`;
    }
  }

  else if (step === 4) {
    const scards = STYLES.map(s => `
      <div class="sc${form.style===s.id?" sel":""}" onclick="selStyle('${s.id}')">
        <div class="sico">${s.icon}</div>
        <div style="flex:1"><div class="sname">${s.name}</div><div class="sdesc">${s.desc}</div></div>
        ${form.style===s.id?'<div class="stk">✓</div>':''}
      </div>`).join("");
    pane.innerHTML = `
      <h1>Refinement preferences</h1>
      <p class="sub">Set your default style and history settings.</p>
      <label class="lbl">Default Style</label>
      ${scards}
      <div class="trow">
        <div><div class="tlbl">Save Prompt History</div><div class="tdesc">Keep local history of refined prompts (last 20)</div></div>
        <button class="tog${form.history?" on":""}" onclick="toggleHist()"><div class="tthumb"></div></button>
      </div>`;
  }

  else if (step === 5) {
    const model = prov?.models.find(m => m.id === form.model);
    const styleNames = {concise:"Concise & Direct",balanced:"Balanced",professional:"Highly Professional",creative:"Creative & Exploratory"};
    pane.innerHTML = `
      <div class="success">
        <div class="sring">✓</div>
        <div class="stitle">You're all set.</div>
        <div class="ssub2">Prompfix is ready to refine your prompts across the web.</div>
        <div class="summary">
          <div class="srow"><span class="sk">Name</span><span class="sv">${esc(form.name)||"—"}</span></div>
          <div class="srow"><span class="sk">Provider</span><span class="sv"><span class="dot" style="background:${prov?.color||"#666"}"></span>${prov?.name||"—"}</span></div>
          <div class="srow"><span class="sk">Model</span><span class="sv">${model?.name||"—"}</span></div>
          <div class="srow"><span class="sk">Style</span><span class="sv">${styleNames[form.style]}</span></div>
          <div class="srow"><span class="sk">History</span><span class="sv"><span class="bdg" style="${form.history?"":"background:rgba(100,100,120,.15);color:var(--txt3)"}">${form.history?"Enabled":"Disabled"}</span></span></div>
        </div>
        <button class="btn btnp" style="font-size:14px;padding:12px 32px;border-radius:9px">Launch Prompfix →</button>
      </div>`;
  }
}

function render() { renderSteps(); renderPane(); }

function selProv(id) {
  if (form.provider !== id) { form.model = ""; }
  form.provider = id;
  render();
}
function selModel(id) { form.model = id; render(); }
function selStyle(id) { form.style = id; render(); }
function toggleKey() { form.showKey = !form.showKey; render(); }
function toggleHist() { form.history = !form.history; render(); }
function esc(s) { return (s||"").replace(/"/g,"&quot;"); }

render();
</script>
