                    "secondary-fixed": "#dee1ff",

            },
            "borderRadius": {

                    "container-max": "1440px"

            "fontFamily": {

<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .bg-glass {
            background-color: rgba(26, 29, 39, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        /* IDE Input styling */
        input:focus {
            outline: none;
            box-shadow: 0 0 0 1px #c7bfff;
            border-color: #c7bfff;
        }
        
        /* Subtle glow active state */
        .glow-active:focus-within {
             box-shadow: 0 0 15px rgba(199, 191, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Progress Bar Container at Top -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-container-high z-50">
<div class="h-full bg-primary transition-all duration-500 ease-out" style="width: 40%;"></div>
</div>
<!-- Main Card Container -->
<main class="w-full max-w-[640px] bg-surface border border-outline-variant rounded-xl shadow-lg flex flex-col overflow-hidden relative">
<!-- Decorative Header / IDE tab bar feel -->
<header class="bg-surface-container-low px-6 py-4 border-b border-outline-variant flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-outline-variant"></span>
<span class="w-3 h-3 rounded-full bg-outline-variant"></span>
<span class="w-3 h-3 rounded-full bg-outline-variant"></span>
</div>
<div class="font-code-sm text-code-sm text-on-surface-variant tracking-wider">
                STEP 02_
            </div>
</header>
<!-- Content Area -->
<section class="p-8 md:p-10 flex flex-col gap-8">
<!-- Header Text -->
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Tell us a bit about you</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We'll use this to personalize your workspace and prompt history.</p>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Full Name Input Group -->
<div class="flex flex-col gap-2 glow-active transition-shadow duration-300 rounded">
<label class="font-code-sm text-code-sm text-on-surface-variant flex items-center gap-2" for="fullName">
<span class="text-primary">&gt;</span> FULL_NAME
                    </label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant material-symbols-outlined text-[18px]">person</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface font-body-md text-body-md py-3 pl-10 pr-4 transition-colors duration-200 focus:bg-surface focus:border-primary placeholder:text-outline" id="fullName" placeholder="Ada Lovelace" type="text"/>
</div>
</div>
<!-- Social Link Input Group -->
<div class="flex flex-col gap-2 glow-active transition-shadow duration-300 rounded">
<label class="font-code-sm text-code-sm text-on-surface-variant flex items-center gap-2" for="socialLink">
<span class="text-primary">&gt;</span> PRIMARY_SOCIAL_LINK
                    </label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant material-symbols-outlined text-[18px]">link</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface font-body-md text-body-md py-3 pl-10 pr-4 transition-colors duration-200 focus:bg-surface focus:border-primary placeholder:text-outline" id="socialLink" placeholder="https://github.com/..." type="url"/>
</div>
</div>
</form>
<!-- Muted Note -->
<div class="mt-2 flex items-start gap-3 p-4 bg-surface-container-low rounded border border-outline-variant/50">
<span class="material-symbols-outlined text-outline-variant text-[20px] mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-code-sm text-code-sm text-on-surface-variant leading-relaxed">
                     This information is stored locally by default. You can configure cloud sync in settings later.
                 </p>
</div>
</section>
<!-- Bottom Navigation / Actions -->
<footer class="bg-surface-container-low p-6 border-t border-outline-variant flex items-center justify-between">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface border border-outline-variant hover:border-outline bg-transparent px-6 py-2.5 rounded transition-all duration-200 flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Back
            </button>
<button class="font-label-md text-label-md text-background bg-[#c7bfff] hover:brightness-110 px-8 py-2.5 rounded transition-all duration-200 flex items-center gap-2 shadow-[0_0_15px_rgba(199,191,255,0.15)]" type="button">
                Continue
                <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</footer>
</main>
</body></html>
