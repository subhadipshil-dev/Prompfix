<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Prompt Studio - Onboarding</title>
<!-- Google Fonts & Icons -->

                      "on-secondary-fixed": "#161a30",
                      "secondary-container": "#444860",
                      "surface-variant": "#33343b",
                      "on-surface-variant": "#c9c4d7",
                      "on-secondary": "#2b2f46",
                      "on-error": "#690005",

                      "inverse-on-surface": "#2e3037",
                      "on-tertiary-fixed": "#2c1600",
                      "surface-bright": "#373940",
                      "inverse-primary": "#5a46d3",
                      "outline": "#928ea0",
                      "surface": "#111319",
                      "on-background": "#e2e2eb",
                      "surface-container-highest": "#33343b",
                      "surface-container-lowest": "#0c0e14",
                      "on-secondary-container": "#b3b7d3",
                      "primary-container": "#8e7fff",
                      "tertiary": "#ffb86d",
                      "on-tertiary-fixed-variant": "#683c00",
                      "error": "#ffb4ab",
                      "surface-container-high": "#282a30",
                      "primary-fixed": "#e4deff",
                      "on-primary-fixed-variant": "#4228bb",
                      "background": "#111319",
                      "on-primary-container": "#25008c",
                      "on-surface": "#e2e2eb",
                      "surface-container-low": "#191b22",
                      "on-tertiary": "#492900",
                      "inverse-surface": "#e2e2eb",
                      "tertiary-fixed-dim": "#ffb86d",
                      "primary": "#c7bfff",
                      "surface-container": "#1e1f26",
                      "secondary-fixed": "#dee1ff",
                      "on-secondary-fixed-variant": "#41455d",
                      "on-error-container": "#ffdad6",
                      "secondary-fixed-dim": "#c2c5e2"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",

                      "xl": "0.75rem",
                      "full": "9999px"

              "spacing": {
                      "gutter": "16px",
                      "unit": "4px",
                      "margin": "24px",
                      "container-max": "1440px"
              },
              "fontFamily": {
                      "label-md": [
                              "Inter"
                      ],
                      "headline-md": [

                      "code-sm": [

                      ],
                      "headline-lg": [

                      "headline-lg": [

              }
      },
          },
        }
    </script>
<style>
        /* Custom styles for glow effects not easily achievable with plain tailwind utilities without arbitrary values */
        .glow-primary {
            box-shadow: 0 0 12px rgba(199, 191, 255, 0.15);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center p-gutter selection:bg-primary-container selection:text-on-primary-container">
<!-- Suppressed TopNavBar & SideNavBar due to Linear Onboarding flow intent -->
<!-- Main Wizard Card -->
<main class="w-full max-w-[640px] bg-surface-container-low rounded-xl border border-outline-variant flex flex-col relative overflow-hidden shadow-2xl">
<!-- Top Progress Bar -->
<div class="absolute top-0 left-0 w-full h-1 bg-surface-variant">
<div class="h-full bg-primary w-[80%] rounded-r-full transition-all duration-500 ease-out"></div>
</div>
<!-- Header -->
<header class="pt-10 pb-6 px-8 border-b border-outline-variant bg-surface">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Workspace Preferences</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Configure your default AI settings to streamline your prompt engineering workflow.</p>
</header>
<!-- Form Content -->
<div class="p-8 flex flex-col gap-8">
<!-- Section 1: AI Model Grid -->
<section class="flex flex-col gap-4">
<div class="flex items-center justify-between">
<h2 class="font-headline-md text-headline-md text-on-surface">Target AI Model</h2>
<span class="font-label-md text-label-md px-2 py-1 bg-surface-variant text-on-surface-variant rounded">Required</span>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="model-selector">
<!-- Option 1 -->
<button class="option-btn group relative flex flex-col items-center justify-center gap-3 p-5 rounded-lg border border-outline-variant bg-surface-container hover:bg-surface-container-high transition-all duration-200 text-left w-full h-full" type="button">
<span class="material-symbols-outlined text-[32px] text-on-surface-variant group-hover:text-on-surface transition-colors">smart_toy</span>
<span class="font-headline-md text-headline-md text-on-surface">GPT-4o</span>
</button>
<!-- Option 2 (Pre-selected) -->
<button class="option-btn selected group relative flex flex-col items-center justify-center gap-3 p-5 rounded-lg border border-primary bg-surface-container-high glow-primary transition-all duration-200 text-left w-full h-full" type="button">
<span class="material-symbols-outlined text-[32px] text-primary">psychology</span>
<span class="font-headline-md text-headline-md text-primary">Claude 3.5</span>
</button>
<!-- Option 3 -->
<button class="option-btn group relative flex flex-col items-center justify-center gap-3 p-5 rounded-lg border border-outline-variant bg-surface-container hover:bg-surface-container-high transition-all duration-200 text-left w-full h-full" type="button">
<span class="material-symbols-outlined text-[32px] text-on-surface-variant group-hover:text-on-surface transition-colors">diamond</span>
<span class="font-headline-md text-headline-md text-on-surface">Gemini 1.5</span>
</button>
</div>
</section>
<!-- Section 2: Refinement Style Stack -->
<section class="flex flex-col gap-4">
<div class="flex items-center justify-between">
<h2 class="font-headline-md text-headline-md text-on-surface">Default Refinement Style</h2>
<span class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                        Can be changed per prompt
                    </span>
</div>
<div class="flex flex-col gap-3" id="style-selector">
<!-- Stacked Option 1 -->
<button class="style-btn group flex items-start gap-4 p-4 rounded-lg border border-outline-variant bg-surface-container hover:bg-surface-container-high transition-all duration-200 text-left w-full" type="button">
<div class="mt-0.5 w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center group-[.selected]:border-primary transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 group-[.selected]:scale-100 transition-transform"></div>
</div>
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-on-surface">Concise</span>
<span class="font-body-md text-body-md text-on-surface-variant">Focuses on minimizing token count while retaining core instructions. Best for simple tasks.</span>
</div>
</button>
<!-- Stacked Option 2 (Pre-selected) -->
<button class="style-btn selected group flex items-start gap-4 p-4 rounded-lg border border-primary bg-surface-container-high glow-primary transition-all duration-200 text-left w-full" type="button">
<div class="mt-0.5 w-5 h-5 rounded-full border-2 border-primary flex items-center justify-center transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-100 transition-transform"></div>
</div>
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-primary">Balanced</span>
<span class="font-body-md text-body-md text-on-surface-variant">Strikes a middle ground between detail and brevity. Ideal for most everyday prompt engineering.</span>
</div>
</button>
<!-- Stacked Option 3 -->
<button class="style-btn group flex items-start gap-4 p-4 rounded-lg border border-outline-variant bg-surface-container hover:bg-surface-container-high transition-all duration-200 text-left w-full" type="button">
<div class="mt-0.5 w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center group-[.selected]:border-primary transition-colors">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 group-[.selected]:scale-100 transition-transform"></div>
</div>
<div class="flex flex-col gap-1">
<span class="font-headline-md text-headline-md text-on-surface">Professional &amp; Detailed</span>
<span class="font-body-md text-body-md text-on-surface-variant">Generates extensive context, negative prompts, and strict output formatting rules.</span>
</div>
</button>
</div>
</section>
</div>
<!-- Footer / Navigation -->
<footer class="p-6 px-8 border-t border-outline-variant bg-surface flex justify-between items-center">
<button class="px-6 py-2.5 rounded-lg border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high hover:text-on-surface transition-all duration-200">
                Back
            </button>
<button class="px-6 py-2.5 rounded-lg bg-primary-container text-on-primary-container font-label-md text-label-md font-bold hover:brightness-110 active:scale-95 transition-all duration-200 flex items-center gap-2 shadow-md">
                Continue
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</footer>
</main>
<!-- Lightweight interaction script -->
<script>
        function setupSelectionGroup(containerId, buttonClass) {
            const container = document.getElementById(containerId);
            const buttons = container.querySelectorAll(`.${buttonClass}`);
            
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all
                    buttons.forEach(b => {
                        b.classList.remove('selected', 'border-primary', 'bg-surface-container-high', 'glow-primary');
                        b.classList.add('border-outline-variant', 'bg-surface-container');
                        
                        // Handle icon colors for grid
                        const icon = b.querySelector('.material-symbols-outlined');
                        const text = b.querySelector('.font-headline-md');
                        if(icon && text && buttonClass === 'option-btn') {
                            icon.classList.remove('text-primary');
                            icon.classList.add('text-on-surface-variant');
                            text.classList.remove('text-primary');
                            text.classList.add('text-on-surface');
                        }

                        // Handle radio button visuals for stack
                        const radioOuter = b.querySelector('.rounded-full.border-2');
                        const radioInner = b.querySelector('.rounded-full.bg-primary');
                        if(radioOuter && radioInner && buttonClass === 'style-btn') {
                            radioOuter.classList.remove('border-primary');
                            radioOuter.classList.add('border-outline-variant');
                            radioInner.classList.remove('scale-100');
                            radioInner.classList.add('scale-0');
                            text.classList.remove('text-primary');
                            text.classList.add('text-on-surface');
                        }
                    });

                    // Set active
                    btn.classList.add('selected', 'border-primary', 'bg-surface-container-high', 'glow-primary');
                    btn.classList.remove('border-outline-variant', 'bg-surface-container');
                    
                    // Handle active icon colors for grid
                    const activeIcon = btn.querySelector('.material-symbols-outlined');
                    const activeText = btn.querySelector('.font-headline-md');
                    if(activeIcon && activeText && buttonClass === 'option-btn') {
                        activeIcon.classList.remove('text-on-surface-variant');
                        activeIcon.classList.add('text-primary');
                        activeText.classList.remove('text-on-surface');
                        activeText.classList.add('text-primary');
                    }

                    // Handle active radio visuals for stack
                    const activeRadioOuter = btn.querySelector('.rounded-full.border-2');
                    const activeRadioInner = btn.querySelector('.rounded-full.bg-primary');
                    if(activeRadioOuter && activeRadioInner && buttonClass === 'style-btn') {
                        activeRadioOuter.classList.remove('border-outline-variant');
                        activeRadioOuter.classList.add('border-primary');
                        activeRadioInner.classList.remove('scale-0');
                        activeRadioInner.classList.add('scale-100');
                        activeText.classList.remove('text-on-surface');
                        activeText.classList.add('text-primary');
                    }
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupSelectionGroup('model-selector', 'option-btn');
            setupSelectionGroup('style-selector', 'style-btn');
        });
    </script>
</body></html>
