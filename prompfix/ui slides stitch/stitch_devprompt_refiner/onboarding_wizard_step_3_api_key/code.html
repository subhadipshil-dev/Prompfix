<style>
        /* Base IDE-like styles */
        body {
            background-color: #0f1117;
            color: #e2e2eb;
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111319; 
        }
        ::-webkit-scrollbar-thumb {
            background: #33343b; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #474554; 
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(26, 29, 39, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid #2d3148;
        }

        /* Input overrides */
        input:focus {
            outline: none;
            box-shadow: none;
            border-color: #7c6af7 !important;
        }

        /* Subtle active glow */
        .active-glow {
            box-shadow: 0 0 15px rgba(124, 106, 247, 0.1);
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Main Container -->
<main class="w-full max-w-[640px] flex flex-col gap-6">
<!-- Brand Header (Simplified for Onboarding) -->
<header class="flex justify-center items-center mb-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-headline-lg text-headline-lg font-black text-primary">PromptRefine</span>
</div>
</header>
<!-- Card Container -->
<div class="glass-panel rounded-xl overflow-hidden shadow-lg flex flex-col">
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-highest">
<div class="h-full bg-primary transition-all duration-500 ease-in-out" style="width: 60%;"></div>
</div>
<!-- Card Content -->
<div class="p-8 flex flex-col gap-8">
<!-- Title & Context -->
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Connect your AI</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Provide an API key to enable prompt testing and execution. This key is stored locally in your browser.
                    </p>
</div>
<!-- Input Section -->
<div class="flex flex-col gap-4">
<label class="font-label-md text-label-md text-on-surface-variant flex justify-between">
<span>API Provider Key</span>
<span class="text-primary cursor-pointer hover:underline">Where do I find this?</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant">key</span>
<input class="w-full bg-[#0f1117] border border-[#2d3148] rounded-lg py-3 pl-10 pr-12 font-code-md text-code-md text-on-surface placeholder-outline-variant focus:border-primary transition-colors" id="api-key-input" placeholder="sk-..." type="password"/>
<button class="absolute right-3 text-on-surface-variant hover:text-on-surface transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined" id="toggle-icon">visibility</span>
</button>
</div>
<!-- Ghost Button for Testing -->
<button class="self-start mt-2 border border-[#2d3148] text-[#e2e8f0] font-label-md text-label-md px-4 py-2 rounded-lg hover:bg-[#222632] hover:brightness-110 transition-all duration-200 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">bolt</span>
                        Test Connection
                    </button>
</div>
<!-- Quick Links (Bento-style chips) -->
<div class="flex flex-col gap-3 mt-4">
<span class="font-label-md text-label-md text-on-surface-variant">Supported Providers</span>
<div class="flex flex-wrap gap-2">
<button class="bg-[#2d3148] text-[#64748b] hover:text-on-surface hover:bg-surface-container-highest transition-colors px-3 py-1.5 rounded-full font-label-md text-label-md border border-transparent hover:border-outline-variant flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-green-500"></span> GPT-4o
                        </button>
<button class="bg-[#2d3148] text-[#64748b] hover:text-on-surface hover:bg-surface-container-highest transition-colors px-3 py-1.5 rounded-full font-label-md text-label-md border border-transparent hover:border-outline-variant flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-orange-400"></span> Claude
                        </button>
<button class="bg-[#2d3148] text-[#64748b] hover:text-on-surface hover:bg-surface-container-highest transition-colors px-3 py-1.5 rounded-full font-label-md text-label-md border border-transparent hover:border-outline-variant flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-blue-400"></span> Gemini
                        </button>
</div>
</div>
</div>
<!-- Bottom Nav / Actions -->
<div class="p-4 px-8 border-t border-[#2d3148] bg-surface-container-low flex justify-between items-center">
<button class="text-on-surface-variant hover:text-on-surface font-label-md text-label-md px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    Back
                </button>
<button class="bg-[#7c6af7] text-white font-label-md text-label-md px-6 py-2.5 rounded-lg hover:brightness-110 transition-all duration-200 active-glow flex items-center gap-2">
                    Continue
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</main>
<script>
        // Password toggle logic
        document.getElementById('toggle-password').addEventListener('click', function() {
            const input = document.getElementById('api-key-input');
            const icon = document.getElementById('toggle-icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>
</body></html>
