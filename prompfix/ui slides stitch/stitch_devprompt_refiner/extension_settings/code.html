<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings - PromptRefine</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        darkMode: "class",
        theme: {
          extend: {

                    "on-secondary-container": "#b3b7d3",

                    "secondary-fixed-dim": "#c2c5e2",
                    "background": "#111319",
                    "outline": "#928ea0",
                    "primary": "#c7bfff",
                    "on-tertiary-fixed-variant": "#683c00",
                    "on-secondary-fixed": "#161a30",
                    "on-tertiary": "#492900",
                    "inverse-primary": "#5a46d3",
                    "surface": "#111319",
                    "surface-container-low": "#191b22",
                    "secondary": "#c2c5e2",
                    "on-background": "#e2e2eb",
                    "tertiary-fixed": "#ffdcbd",
                    "on-primary-container": "#25008c",
                    "error-container": "#93000a",
                    "inverse-on-surface": "#2e3037",
                    "on-surface": "#e2e2eb",
                    "surface-tint": "#c7bfff",
                    "surface-container": "#1e1f26",
                    "on-secondary": "#2b2f46",
                    "surface-dim": "#111319",
                    "surface-bright": "#373940",
                    "surface-container-high": "#282a30",
                    "on-tertiary-fixed": "#2c1600",
                    "tertiary-container": "#cd7f1a",
                    "secondary-fixed": "#dee1ff",
                    "secondary-container": "#444860",
                    "on-error": "#690005",
                    "primary-fixed-dim": "#c7bfff",
                    "on-primary-fixed": "#180065",
                    "surface-variant": "#33343b",
                    "tertiary-fixed-dim": "#ffb86d",
                    "inverse-surface": "#e2e2eb",
                    "error": "#ffb4ab",
                    "on-secondary-fixed-variant": "#41455d",
                    "surface-container-lowest": "#0c0e14",
                    "on-tertiary-container": "#402300",
                    "surface-container-highest": "#33343b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-max": "1440px",
                    "unit": "4px",
                    "gutter": "16px",
                    "margin": "24px"
            },
            "fontFamily": {
                    "code-sm": [
                            "JetBrains Mono"
                    ],
                    "code-md": [
                            "JetBrains Mono"
                    ],
                    "body-md": [
                            "Inter"
                    ],
                    "label-md": [
                            "Inter"
                    ],
                    "headline-lg": [
                            "Inter"
                    ],
                    "headline-md": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "code-sm": [
                            "12px",
                            {
                                    "lineHeight": "18px",
                                    "fontWeight": "400"
                            }
                    ],
                    "code-md": [
                            "13px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "400"
                            }
                    ],
                    "body-md": [

                    ],
                    "label-md": [

                    "headline-md": [

                                    "letterSpacing": "-0.01em",

                    ]
            }
    },
        },
      }
    </script>
<style>
        body {
            background-color: #0f1117;
            color: #e2e2eb;
            font-family: 'Inter', sans-serif;
        }
        .surface-panel {
            background-color: #1a1d27;
            border: 1px solid #2d3148;
        }
        .input-focus:focus-within {
            border-color: #7c6af7;
            box-shadow: 0 0 0 2px rgba(124, 106, 247, 0.1);
        }
        .btn-primary {
            background-color: #7c6af7;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            filter: brightness(1.1);
        }
        .custom-radio {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #474554;
            border-radius: 50%;
            outline: none;
            transition: all 0.2s;
            background-color: transparent;
            position: relative;
        }
        .custom-radio:checked {
            border-color: #7c6af7;
        }
        .custom-radio:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #7c6af7;
        }
        .toggle-switch {
            appearance: none;
            width: 40px;
            height: 20px;
            background-color: #474554;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s;
        }
        .toggle-switch:checked {
            background-color: #7c6af7;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch:checked::after {
            transform: translateX(20px);
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-start pt-16 pb-16">
<div class="w-full max-w-[720px] px-margin md:px-0">
<!-- Header -->
<header class="flex items-center gap-4 mb-8">
<button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Settings</h1>
</header>
<div class="space-y-6">
<!-- Section 1: AI Model -->
<section class="surface-panel rounded-lg p-6">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">AI Model</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Select the default language model for refinement tasks.</p>
<div class="relative input-focus rounded border border-[#2d3148] bg-[#0f1117] transition-all">
<select class="w-full appearance-none bg-transparent border-none focus:ring-0 text-on-surface font-body-md text-body-md py-3 pl-4 pr-10 cursor-pointer">
<option class="bg-surface" value="gpt4o">GPT-4o</option>
<option class="bg-surface" value="claude35">Claude 3.5 Sonnet</option>
<option class="bg-surface" value="gemini15">Gemini 1.5 Pro</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</section>
<!-- Section 2: Refinement Style -->
<section class="surface-panel rounded-lg p-6">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Refinement Style</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Choose how the AI should structure the output.</p>
<div class="space-y-3">
<label class="flex items-center gap-3 cursor-pointer group p-3 rounded hover:bg-[#222632] transition-colors border-b border-[#2d3148]">
<input class="custom-radio" name="refinement_style" type="radio" value="concise"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-white transition-colors">Concise</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group p-3 rounded hover:bg-[#222632] transition-colors border-b border-[#2d3148]">
<input checked="" class="custom-radio" name="refinement_style" type="radio" value="detailed"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-white transition-colors">Detailed</span>
</label>
<label class="flex items-center gap-3 cursor-pointer group p-3 rounded hover:bg-[#222632] transition-colors">
<input class="custom-radio" name="refinement_style" type="radio" value="code"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-white transition-colors">Code-focused</span>
</label>
</div>
</section>
<!-- Section 3: Keyboard Shortcut -->
<section class="surface-panel rounded-lg p-6">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Keyboard Shortcut</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Global shortcut to trigger Prompt Studio.</p>
<div class="flex items-center gap-4">
<div class="flex-1 input-focus rounded border border-[#2d3148] bg-[#0f1117] transition-all flex items-center px-4 py-2">
<span class="material-symbols-outlined text-on-surface-variant mr-3 text-sm" data-icon="keyboard">keyboard</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-on-surface font-code-md text-code-md tracking-wider p-0" spellcheck="false" type="text" value="Cmd+Shift+P"/>
</div>
<button class="px-4 py-2 rounded border border-[#2d3148] text-on-surface-variant font-label-md text-label-md hover:bg-[#222632] hover:text-white transition-colors">Reset</button>
</div>
</section>
<!-- Section 4: Theme -->
<section class="surface-panel rounded-lg p-6 flex justify-between items-center">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Theme</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Toggle dark mode manually.</p>
</div>
<div class="flex items-center gap-3">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Dark</span>
<input checked="" class="toggle-switch" type="checkbox"/>
</div>
</section>
<!-- Footer Action -->
<div class="pt-6">
<button class="w-full btn-primary font-headline-md text-headline-md py-4 rounded-lg flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(124,106,247,0.15)] hover:shadow-[0_0_20px_rgba(124,106,247,0.25)]">
<span class="material-symbols-outlined text-[20px]" data-icon="save">save</span>
                    Save Changes
                </button>
</div>
</div>
</div>
</body></html>
